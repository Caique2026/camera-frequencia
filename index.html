      id="video"
      autoplay
      playsinline

    </video>

    <canvas id="canvas"></canvas>

    <button
      id="tirarFoto"

  <script>

    let stream = null;

    let cameraPronta = false;


    /* =========================================
       ABRIR CÂMERA
       ========================================= */

    window.addEventListener(
      "load",
      abrirCamera
    );


    async function abrirCamera() {

      const video =
        document.getElementById("video");

      const botao =
        document.getElementById("tirarFoto");

      const mensagem =
        document.getElementById("mensagem");


      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {

        mensagem.innerHTML =
          "<b>Seu navegador não permite acesso à câmera.</b>";

        return;

      }


      try {

        mensagem.textContent =
          "Solicitando acesso à câmera...";


        stream =
          await navigator.mediaDevices.getUserMedia({

            video: {
              facingMode: "user"
            },

            audio: false

          });


        video.srcObject =
          stream;


        video.onloadedmetadata =
          function() {

            video.play();

            cameraPronta = true;

            botao.disabled = false;

            botao.textContent =
              "TIRAR FOTO";

            mensagem.textContent =
              "Câmera pronta. Tire sua foto.";

          };


      }

      catch (erro) {

        console.error(erro);

        mensagem.innerHTML =
          "<b>Não foi possível abrir a câmera.</b><br><br>" +
          "Permita o acesso à câmera no navegador e tente novamente.";

      }

    }

      const canvas =
        document.getElementById("canvas");

      const botao =
        document.getElementById("tirarFoto");

      const mensagem =
        document.getElementById("mensagem");


      if (!cameraPronta) {

        mensagem.textContent =
          "Aguarde a câmera ficar pronta.";

        return;

      }


      if (
        !video.videoWidth ||
        !video.videoHeight
      ) {

        mensagem.textContent =
          "A câmera ainda está carregando.";

        return;

      }


      botao.disabled = true;

      mensagem.textContent =
        "Tirando foto...";


      canvas.width =
        video.videoWidth;

      canvas.height =
        video.videoHeight;


      const contexto =
        canvas.getContext("2d");


      contexto.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );


      const foto =
        canvas.toDataURL(
          "image/jpeg",
          0.85
        );

        Por enquanto estamos apenas
        testando a câmera.

        stream
          .getTracks()
          .forEach(function(track) {

            track.stop();

          });

      }

        "<b>Foto tirada com sucesso!</b><br><br>" +
        "A câmera está funcionando corretamente.";

      console.log(
        "Foto capturada:",
        foto.substring(0, 50)
      );

    }
