```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste da Câmera</title>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #f2f4f7;
  padding: 20px;
}

.caixa {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 15px;
}

video {
  width: 100%;
  border-radius: 10px;
  background: black;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 20px;
  border: none;
  border-radius: 8px;
  background: #1976d2;
  color: white;
  font-size: 18px;
  font-weight: bold;
}

#mensagem {
  margin-top: 20px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="caixa">

<h1>Tire sua foto</h1>

<p>A foto deve ser tirada agora pela câmera.</p>

<video id="video" autoplay playsinline></video>

<button id="botao" disabled>
AGUARDE A CÂMERA...
</button>

<div id="mensagem">
Abrindo câmera...
</div>

</div>

<script>

const video = document.getElementById("video");
const botao = document.getElementById("botao");
const mensagem = document.getElementById("mensagem");

async function abrirCamera() {

  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
      });

    video.srcObject = stream;

    botao.disabled = false;
    botao.textContent = "TIRAR FOTO";

    mensagem.textContent =
      "Câmera funcionando!";

  } catch (erro) {

    mensagem.textContent =
      "Erro ao abrir a câmera: " + erro.message;

  }

}

botao.onclick = function() {

  mensagem.textContent =
    "Foto tirada com sucesso!";

};

abrirCamera();

</script>

</body>
</html>
```
