<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Frequência - Câmera</title>

<style>

body {
  font-family: Arial, sans-serif;
  background: #f2f4f7;
  margin: 0;
  padding: 20px;
  text-align: center;
}

.caixa {
  max-width: 500px;
  margin: 30px auto;
  background: white;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.10);
}

h1 {
  margin-bottom: 10px;
}

p {
  color: #555;
}

video {
  width: 100%;
  border-radius: 10px;
  background: black;
  margin-top: 15px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 20px;
  border: none;
  border-radius: 8px;
  background: #1976d2;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  background: #999;
}

#mensagem {
  margin-top: 20px;
  font-weight: bold;
  line-height: 1.5;
}

canvas {
  display: none;
}

</style>

</head>

<body>

<div class="caixa">

<h1>Tire sua foto</h1>

<p>
A foto deve ser tirada agora pela câmera.
</p>

<video
  id="video"
  autoplay
  playsinline
></video>

<button
  id="botao"
  disabled
>
ABRINDO CÂMERA...
</button>

<div id="mensagem">
Abrindo câmera...
</div>

<canvas id="canvas"></canvas>

</div>


<script>


/* ============================================
   CONFIGURAÇÃO
   ============================================ */

const APP_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzuGKlUdm__TWhxcutco2o8vDoF95zt-D-kmNS739ioizCaNYcrr8lZZqeIFj7kFFlb/exec";


const video =
document.getElementById("video");


const botao =
document.getElementById("botao");


const mensagem =
document.getElementById("mensagem");


const canvas =
document.getElementById("canvas");


let stream = null;


/* ============================================
   TOKEN
   ============================================ */

const parametros =
new URLSearchParams(
window.location.search
);


const token =
parametros.get("token");


if (!token) {

  mensagem.innerHTML =
  "<b>Erro:</b><br>" +
  "Sessão da frequência não encontrada.";

}


/* ============================================
   ABRIR CÂMERA
   ============================================ */

async function abrirCamera() {

  try {

    stream =
    await navigator.mediaDevices.getUserMedia({

      video: {
        facingMode: "user"
      },

      audio: false

    });


    video.srcObject =
    stream;


    botao.disabled =
    false;


    botao.textContent =
    "TIRAR FOTO";


    mensagem.textContent =
    "Câmera pronta. Tire sua foto.";

  }

  catch (erro) {

    mensagem.innerHTML =
    "<b>Erro ao abrir a câmera:</b><br>" +
    erro.message;

  }

}


/* ============================================
   PARAR CÂMERA
   ============================================ */

function pararCamera() {

  if (!stream) {
    return;
  }


  stream
    .getTracks()
    .forEach(
      function(track) {

        track.stop();

      }
    );


  video.srcObject =
  null;

}


/* ============================================
   TIRAR FOTO
   ============================================ */

botao.onclick =
function() {

  if (!token) {

    mensagem.textContent =
    "Sessão inválida.";

    return;

  }


  botao.disabled =
  true;


  botao.textContent =
  "PROCESSANDO...";


  mensagem.textContent =
  "Capturando foto...";


  const larguraOriginal =
  video.videoWidth;


  const alturaOriginal =
  video.videoHeight;


  if (
    !larguraOriginal ||
    !alturaOriginal
  ) {

    mensagem.textContent =
    "A câmera ainda não está pronta.";

    botao.disabled =
    false;

    botao.textContent =
    "TIRAR FOTO";

    return;

  }


  const larguraMaxima =
  800;


  let largura =
  larguraOriginal;


  let altura =
  alturaOriginal;


  if (
    largura > larguraMaxima
  ) {

    altura =
    Math.round(
      altura *
      larguraMaxima /
      largura
    );


    largura =
    larguraMaxima;

  }


  canvas.width =
  largura;


  canvas.height =
  altura;


  const contexto =
  canvas.getContext("2d");


  contexto.drawImage(

    video,

    0,

    0,

    largura,

    altura

  );


  const foto =
  canvas.toDataURL(
    "image/jpeg",
    0.70
  );


  /* ----------------------------------------
     PARAR CÂMERA
     ---------------------------------------- */

  pararCamera();


  mensagem.textContent =
  "Foto capturada. ENVIANDO...";


  botao.textContent =
  "ENVIANDO...";


  enviarFoto(foto);

};


/* ============================================
   ENVIAR FOTO
   ============================================ */

function enviarFoto(foto) {

  mensagem.textContent =
  "ENVIANDO FREQUÊNCIA...";


  const formulario =
  document.createElement("form");


  formulario.method =
  "POST";


  formulario.action =
  APP_SCRIPT_URL;


  formulario.target =
  "_self";


  /* TOKEN */

  const campoToken =
  document.createElement("input");


  campoToken.type =
  "hidden";


  campoToken.name =
  "token";


  campoToken.value =
  token;


  formulario.appendChild(
    campoToken
  );


  /* FOTO */

  const campoFoto =
  document.createElement("input");


  campoFoto.type =
  "hidden";


  campoFoto.name =
  "foto";


  campoFoto.value =
  foto;


  formulario.appendChild(
    campoFoto
  );


  document.body.appendChild(
    formulario
  );


  mensagem.textContent =
  "ENVIANDO FREQUÊNCIA...";


  formulario.submit();

}


/* ============================================
   INICIAR
   ============================================ */

if (token) {

  abrirCamera();

}

</script>

</body>

</html>
